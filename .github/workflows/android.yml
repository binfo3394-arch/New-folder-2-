name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android SDK to local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > child-app/local.properties
        echo "sdk.dir=$ANDROID_HOME" > parent-app/local.properties

    - name: Build Child App APK
      run: |
        cd child-app
        gradle wrapper --gradle-version 8.5 --no-daemon
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Build Parent App APK
      run: |
        cd parent-app
        gradle wrapper --gradle-version 8.5 --no-daemon
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Child APK
      uses: actions/upload-artifact@v4
      with:
        name: child-app-debug
        path: child-app/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Parent APK
      uses: actions/upload-artifact@v4
      with:
        name: parent-app-debug
        path: parent-app/app/build/outputs/apk/debug/app-debug.apk
