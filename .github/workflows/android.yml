name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create google-services.json for Child App
      run: echo "${{ secrets.CHILD_GOOGLE_SERVICES }}" > child-app/app/google-services.json

    - name: Create google-services.json for Parent App
      run: echo "${{ secrets.PARENT_GOOGLE_SERVICES }}" > parent-app/app/google-services.json

    - name: Make Gradlew Executable
      run: |
        chmod +x child-app/gradlew
        chmod +x parent-app/gradlew

    - name: Build Child App APK
      run: |
        cd child-app
        ./gradlew assembleDebug

    - name: Build Parent App APK
      run: |
        cd parent-app
        ./gradlew assembleDebug

    - name: Upload Child APK
      uses: actions/upload-artifact@v4
      with:
        name: child-app-debug
        path: child-app/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Parent APK
      uses: actions/upload-artifact@v4
      with:
        name: parent-app-debug
        path: parent-app/app/build/outputs/apk/debug/app-debug.apk
